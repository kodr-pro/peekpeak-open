[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.37"
optimizer = true
optimizer_runs = 1000
via_ir = false
fs_permissions = [{ access = "read", path = "./"}]
gas_reports = ["PeekRegistry", "PharaohEpochKeeper"]

[fuzz]
runs = 1000
max_test_rejects = 65536

[invariant]
runs = 512
depth = 64
fail_on_revert = false

[profile.fuzz]
fuzz = { runs = 100000 }
invariant = { runs = 2048, depth = 128 }

[profile.coverage]
fuzz = { runs = 128 }
invariant = { runs = 64, depth = 32 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
